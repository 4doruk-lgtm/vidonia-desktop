name: Build Windows app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Make sure engine folders exist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/realesrgan | Out-Null
          New-Item -ItemType Directory -Force -Path bin/rife | Out-Null

      - name: Download AI engine (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip" -OutFile bin/realesrgan.zip
          Expand-Archive -Path bin/realesrgan.zip -DestinationPath bin/tmp-realesrgan -Force
          $exe = Get-ChildItem -Path bin/tmp-realesrgan -Recurse -Filter realesrgan-ncnn-vulkan.exe | Select-Object -First 1
          Copy-Item -Path "$($exe.DirectoryName)\*" -Destination bin/realesrgan -Recurse -Force

      - name: Download 120 fps engine (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-windows.zip" -OutFile bin/rife.zip
          Expand-Archive -Path bin/rife.zip -DestinationPath bin/tmp-rife -Force
          $exe = Get-ChildItem -Path bin/tmp-rife -Recurse -Filter rife-ncnn-vulkan.exe | Select-Object -First 1
          Copy-Item -Path "$($exe.DirectoryName)\*" -Destination bin/rife -Recurse -Force

      - name: Build the Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: "electron-builder"
        run: |
          npm run dist 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show the real error (only when the build failed)
        if: failure()
        shell: pwsh
        run: Get-Content build.log -Tail 150

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vidonia ${{ github.run_number }}
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
