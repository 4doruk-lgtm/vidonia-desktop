name: Build Windows app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Download AI engine (Real-ESRGAN, NVIDIA via Vulkan)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip" -OutFile bin/realesrgan.zip
          Expand-Archive -Path bin/realesrgan.zip -DestinationPath bin/realesrgan -Force
          $exe = Get-ChildItem -Path bin/realesrgan -Recurse -Filter realesrgan-ncnn-vulkan.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path bin/final | Out-Null
          Copy-Item -Path "$($exe.DirectoryName)\*" -Destination bin/final -Recurse -Force
          Get-ChildItem bin/final

      - name: Build the Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vidonia ${{ github.run_number }}
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
